name: deploy-macmini

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Mac mini 原生发布
    runs-on: macmini-deploy
    timeout-minutes: 35
    steps:
      - name: 检出本次发布的提交
        uses: builtin:checkout
        with:
          submodules: true
      - name: 构建、迁移并切换生产版本
        run: bash .devops/scripts/release-main.sh '${{ github.sha }}'
        timeout-minutes: 30
