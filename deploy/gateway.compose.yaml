services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    ports:
      - '${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080'
    environment:
      GATEWAY_WEB_UPSTREAM: ${GATEWAY_WEB_UPSTREAM:-http://host.docker.internal:5173}
      GATEWAY_API_UPSTREAM: ${GATEWAY_API_UPSTREAM:-http://host.docker.internal:3001}
      GATEWAY_WEB_READ_TIMEOUT: ${GATEWAY_WEB_READ_TIMEOUT:-30s}
      NGINX_ENVSUBST_FILTER: '^GATEWAY_'
    restart: unless-stopped
