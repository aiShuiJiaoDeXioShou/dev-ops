<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img"><title>小李 · 产品助手</title><style>
/* 各角色错开呼吸与眨眼节奏，动作仅表达角色个性，不表示运行状态。 */
.character{transform-origin:48px 68px;animation:idle 4.6s ease-in-out -0.8s infinite}
.eyes{transform-origin:48px 45px;animation:blink 6.6s ease-in-out -1.8s infinite}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0) scale(1)}40%{transform:translateY(-4px) rotate(4deg) scale(1.025,.985)}72%{transform:translateY(-1px) rotate(-2.0deg) scale(.99,1.015)}}
@keyframes blink{0%,41%,46%,100%{transform:scaleY(1)}43%,44%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){.character,.eyes{animation:none!important}}
</style><ellipse cx="48" cy="84" rx="21" ry="3" fill="#17242b" opacity=".045"/><g class="character"><g transform="rotate(-8 48 48)"><path d="M22 25C25 13 39 13 46 17 58 10 76 19 78 32c8 8 7 22 1 29-2 16-18 21-29 17-12 5-28 0-30-12C7 57 9 39 22 25Z" fill="#EF9B91"/><path d="M27 30c4-6 10-9 16-9" stroke="white" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/><g class="eyes"><rect x="35" y="38" width="7" height="14" rx="3.5" fill="#253334"/><rect x="53" y="38" width="7" height="14" rx="3.5" fill="#253334"/></g></g></g></svg>
