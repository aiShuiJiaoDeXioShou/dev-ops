<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevOps · Bot 小角色</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9fafb;color:#202428;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1180px;margin:auto;padding:48px 32px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.eyebrow{font-size:11px;color:#92979e;letter-spacing:1.3px}h1{font-size:30px;letter-spacing:-.7px;margin:12px 0}header p{margin:0;color:#878b92}a{color:#4176e6;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.character-card{position:relative;text-align:left;background:#fff;border:1px solid #e4e7eb;border-radius:18px;padding:20px;cursor:pointer;color:inherit;font:inherit}.character-card[aria-pressed=true]{border-color:#95b0ee;box-shadow:0 0 0 1px #95b0ee}.character-card:focus-visible{outline:3px solid #aac1ff;outline-offset:3px}.letter{font-size:11px;color:#9599a1}.character-card>svg{display:block;width:120px;height:120px;margin:14px auto 24px}h2{font-size:17px;display:flex;align-items:center;gap:10px;margin:0}h2 small{font-size:11px;font-weight:400;color:#969aa2}.character-card p{font-size:12px;color:#92969d;margin:8px 0 20px}.mini{display:flex;align-items:center;gap:9px;background:#f7f8fa;border-radius:8px;padding:8px;font-size:12px}.dot{width:5px;height:5px;border-radius:50%;background:#419a6d;margin-left:auto;margin-right:5px}.demo{display:grid;grid-template-columns:1fr 1fr;background:white;border:1px solid #e4e7eb;border-radius:18px;margin-top:24px;overflow:hidden}.stage{min-height:270px;position:relative;background:#f4f6f8;display:flex;align-items:center;justify-content:center}.stage svg{width:170px;height:170px}.stage-caption{position:absolute;bottom:20px;color:#9ba0a8;font-size:11px}.demo-copy{padding:40px}.demo-copy h2{font-size:20px}.demo-copy p{color:#8b9098;line-height:1.8;font-size:13px;margin:12px 0 22px}.controls{display:flex;gap:8px}.controls button{border:1px solid #e3e6eb;border-radius:8px;background:white;padding:9px 17px;color:#727780;cursor:pointer}.controls button[aria-pressed=true]{background:#edf2ff;color:#4176e6;border-color:#d6e2ff}footer{margin-top:22px;color:#989ca4;font-size:11px;display:flex;justify-content:space-between}.card-static .character{animation:none}.character-card:hover .character{animation:peek 1s ease-in-out}.character-card:hover .eyes{animation:blink 3s infinite}.stage .character{animation:breathe 5.6s ease-in-out infinite}.stage .eyes{animation:blink 6.4s infinite}.stage[data-mood=thinking] .character{animation:ponder 2.6s ease-in-out infinite}.stage[data-mood=thinking] .eyes{animation:look 2.6s ease-in-out infinite}.stage[data-mood=done] .character{animation:hop 1s ease-in-out 2}.stage[data-mood=done] .eyes{animation:smile 2s ease-in-out 1}.character{transform-origin:48px 62px}.eyes{transform-origin:48px 46px}
@keyframes breathe{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-2px) rotate(1deg)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes peek{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg) translateY(-3px)}}@keyframes ponder{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg) translateY(-3px)}}@keyframes look{0%,100%{transform:translate(-2px,-2px)}50%{transform:translate(2px,-2px)}}@keyframes hop{0%,100%{transform:translateY(0)}20%{transform:scale(1.05,.94)}50%{transform:translateY(-10px) rotate(-5deg)}75%{transform:scale(1.04,.96)}}@keyframes smile{0%,100%{transform:scaleY(1)}20%,80%{transform:scaleY(.25)}}@media(prefers-reduced-motion:reduce){.character,.eyes{animation:none!important}}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}header{display:block}header a{display:inline-block;margin-top:18px}.demo{grid-template-columns:1fr}.demo-copy{padding:25px}main{padding:24px}footer{gap:20px}}
</style></head><body><main><header><div><div class="eyebrow">DEVOPS / BOT CHARACTERS</div><h1>有一点好奇，也有一点个性。</h1><p>同一套小角色，用轮廓、颜色和眼神区分彼此。</p></div><a href="/?v=20261107-7&view=project-bots">在项目中查看 ↗</a></header><div class="cards card-static"><button class="character-card" data-character="orbit" aria-pressed="true"><span class="letter">01</span><svg viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="48" cy="84" rx="21" ry="3" fill="#17242b" opacity=".045"/><g class="character"><g transform="rotate(-8 48 48)"><path d="M22 25C25 13 39 13 46 17 58 10 76 19 78 32c8 8 7 22 1 29-2 16-18 21-29 17-12 5-28 0-30-12C7 57 9 39 22 25Z" fill="#EF9B91"/><path d="M27 30c4-6 10-9 16-9" stroke="white" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/><g class="eyes"><rect x="35" y="38" width="7" height="14" rx="3.5" fill="#253334"/><rect x="53" y="38" width="7" height="14" rx="3.5" fill="#253334"/></g></g></g></svg><h2>小李<small>产品助手</small></h2><p>好奇、热情</p><div class="mini"><img src="assets/bot-orbit.svg?v=20261107-7" width="32" height="32" alt=""><span>小李</span><span class="dot"></span></div></button><button class="character-card" data-character="prism" aria-pressed="false"><span class="letter">02</span><svg viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="48" cy="84" rx="21" ry="3" fill="#17242b" opacity=".045"/><g class="character"><g transform="rotate(7 48 48)"><path d="M25 18C40 11 58 14 70 23c12 9 17 26 10 39-7 13-22 18-38 15C26 82 15 72 15 56 9 41 13 25 25 18Z" fill="#89C9B2"/><path d="M27 30c4-6 10-9 16-9" stroke="white" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/><g class="eyes"><rect x="35" y="38" width="7" height="14" rx="3.5" fill="#253334"/><rect x="53" y="38" width="7" height="14" rx="3.5" fill="#253334"/></g></g></g></svg><h2>小林<small>研发助手</small></h2><p>沉稳、专注</p><div class="mini"><img src="assets/bot-prism.svg?v=20261107-7" width="32" height="32" alt=""><span>小林</span><span class="dot"></span></div></button><button class="character-card" data-character="signal" aria-pressed="false"><span class="letter">03</span><svg viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="48" cy="84" rx="21" ry="3" fill="#17242b" opacity=".045"/><g class="character"><g transform="rotate(-4 48 48)"><path d="M18 39C21 26 32 23 39 13c4-6 11-5 15 2l7 9c15 1 23 12 22 28-1 15-11 27-26 25-8 6-19 3-25-2-13 0-22-9-18-22Z" fill="#EBC57D"/><path d="M27 30c4-6 10-9 16-9" stroke="white" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/><g class="eyes"><rect x="35" y="38" width="7" height="14" rx="3.5" fill="#253334"/><rect x="53" y="38" width="7" height="14" rx="3.5" fill="#253334"/></g></g></g></svg><h2>小渡<small>交付助手</small></h2><p>轻快、可靠</p><div class="mini"><img src="assets/bot-signal.svg?v=20261107-7" width="32" height="32" alt=""><span>小渡</span><span class="dot"></span></div></button><button class="character-card" data-character="aperture" aria-pressed="false"><span class="letter">04</span><svg viewBox="0 0 96 96" aria-hidden="true"><ellipse cx="48" cy="84" rx="21" ry="3" fill="#17242b" opacity=".045"/><g class="character"><g transform="rotate(6 48 48)"><path d="M34 19c5-13 22-13 28 1 16-2 26 12 19 26 10 13 2 29-14 29-9 15-26 13-32 2-18 3-28-12-20-25-10-15 0-32 19-33Z" fill="#B7ABE1"/><path d="M27 30c4-6 10-9 16-9" stroke="white" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/><g class="eyes"><rect x="35" y="38" width="7" height="14" rx="3.5" fill="#253334"/><rect x="53" y="38" width="7" height="14" rx="3.5" fill="#253334"/></g></g></g></svg><h2>星野<small>移动端助手</small></h2><p>灵巧、爱探索</p><div class="mini"><img src="assets/bot-aperture.svg?v=20261107-7" width="32" height="32" alt=""><span>星野</span><span class="dot"></span></div></button></div><section class="demo"><div class="stage" data-mood="idle"><svg id="active-character" viewBox="0 0 96 96" aria-label="小李待命动画"><ellipse cx="48" cy="84" rx="21" ry="3" fill="#17242b" opacity=".045"/><g class="character"><g transform="rotate(-8 48 48)"><path d="M22 25C25 13 39 13 46 17 58 10 76 19 78 32c8 8 7 22 1 29-2 16-18 21-29 17-12 5-28 0-30-12C7 57 9 39 22 25Z" fill="#EF9B91"/><path d="M27 30c4-6 10-9 16-9" stroke="white" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/><g class="eyes"><rect x="35" y="38" width="7" height="14" rx="3.5" fill="#253334"/><rect x="53" y="38" width="7" height="14" rx="3.5" fill="#253334"/></g></g></g></svg><span class="stage-caption">动作演示 · 点击右侧切换</span></div><div class="demo-copy"><h2 id="active-name">小李 · 产品助手</h2><p>轻轻眨眼，偶尔探头。<br>对话中有一点小动作，列表里保持安静。</p><div class="controls" aria-label="动作状态"><button data-mood="idle" aria-pressed="true">待命</button><button data-mood="thinking" aria-pressed="false">思考</button><button data-mood="done" aria-pressed="false">完成</button></div></div></section><footer><span>原创 SVG 角色 · 支持减少动态效果</span><a href="https://x.ai/news/designing-grok-bot">风格参考：Grok Bot 设计说明 ↗</a></footer></main><script>
/** 更新当前角色或动作演示。@param {MouseEvent} event 点击事件。@returns {void} 只改变本页的预览状态。 */
function updatePreview(event){const card=event.target.closest('[data-character]');if(card){document.querySelectorAll('[data-character]').forEach(item=>item.setAttribute('aria-pressed',String(item===card)));const svg=document.getElementById('active-character');svg.replaceChildren(...Array.from(card.querySelector('svg').childNodes).map(node=>node.cloneNode(true)));document.getElementById('active-name').textContent=card.querySelector('h2').innerText;svg.setAttribute('aria-label',card.querySelector('h2').innerText+'动作预览');}const control=event.target.closest('button[data-mood]');if(control){document.querySelectorAll('button[data-mood]').forEach(item=>item.setAttribute('aria-pressed',String(item===control)));const stage=document.querySelector('.stage');stage.dataset.mood='';void stage.offsetWidth;stage.dataset.mood=control.dataset.mood;}}
document.addEventListener('click',updatePreview);
</script></body></html>
