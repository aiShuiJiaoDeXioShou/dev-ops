const names={"a": "折叠 D", "b": "双环", "c": "汇流", "d": "折面", "e": "小伙伴", "f": "模块 D"};
/** 切换当前图标方向，同时更新品牌预览、选中状态和 SVG 下载地址。@param {MouseEvent} event 点击事件。@returns {void} 仅更新本页预览。 */
function selectDirection(event){const card=event.target.closest('[data-id]');if(!card)return;const id=card.dataset.id;document.querySelectorAll('[data-id]').forEach(item=>item.setAttribute('aria-pressed',String(item===card)));document.getElementById('live-mark').replaceChildren(card.querySelector('.sidebar-sample svg').cloneNode(true));document.getElementById('chosen').textContent=id.toUpperCase()+' · '+names[id];const link=document.getElementById('download');link.href='assets/brand-directions/'+id+'.svg';link.download='devops-brand-'+id+'.svg';}

</script></body></html>
